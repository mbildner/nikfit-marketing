[project]
name = "nikfit-marketing"
version = "0.0.0"
description = "Static marketing site for Nikfit (nik.fit)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "site"]

[tool.ruff.lint]
# E/W/F: pycodestyle + pyflakes basics
# B: bugbear (common foot-guns)
# S: bandit-style security checks (catches things like shell=True, hardcoded
#    passwords, insecure hash usage)
# UP: pyupgrade (modern syntax)
# I: isort (import order)
select = ["E", "W", "F", "B", "S", "UP", "I"]
ignore = [
    "E501",   # line length is informational; ruff format would enforce
]
