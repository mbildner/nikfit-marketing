name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # gitleaks needs history to scan PR commits

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Ruff lint
        run: uvx ruff@0.15.5 check .

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Enable corepack (provides yarn)
        run: corepack enable

      - name: yarn install --immutable
        run: yarn install --immutable

      - name: yarn test
        run: yarn test

  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Render templates
        run: uv run render.py

      - name: Verify out/ matches committed templates
        run: |
          if ! git diff --quiet out/; then
            echo "::error::out/ is stale. Run 'uv run render.py' locally and commit the diff."
            git --no-pager diff out/ | head -50
            exit 1
          fi

  configure-netlify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Verify NETLIFY_AUTH_TOKEN secret is set
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN repo secret is not set."
            echo ""
            echo "To fix:"
            echo "  1. Create a PAT at:"
            echo "     https://app.netlify.com/user/applications#personal-access-tokens"
            echo "  2. Save it to this repo:"
            echo "     gh secret set NETLIFY_AUTH_TOKEN -R mbildner/nikfit-marketing"
            echo "  3. Re-run this workflow."
            exit 1
          fi

      - name: Sync Netlify site config
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: uv run scripts/configure_netlify.py
