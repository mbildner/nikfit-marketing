<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nikfit{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand">Nikfit</a>
      <div class="nav-links">
        <a href="schedule.html" {% if page == 'schedule' %}class="active"{% endif %}>Schedule</a>
        <a href="inquire.html" {% if page == 'inquire' %}class="active"{% endif %}>Inquire</a>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <h4>Find me</h4>
          <a href="https://instagram.com/nikfit.training">@nikfit.training</a><br>
          <a href="tel:+12015550127">(201) 555-0127</a><br>
          hello@nikfit.studio
        </div>
        <div>
          <h4>Where</h4>
          Teaneck, NJ<br>
          Serving Bergen County<br>
          Mon–Sat · By appointment
        </div>
      </div>
      <div class="footer-bottom">
        © 2026 Nikfit · Coached by Nikki Stein
      </div>
    </div>
  </footer>
</body>
</html>
