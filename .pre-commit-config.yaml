# Pre-commit hooks mirroring .github/workflows/ci.yml so issues land
# locally before they hit CI.
#
# Install once:
#   uv tool install pre-commit   # or: brew install pre-commit
#   pre-commit install
#
# Run all hooks against the current tree (sanity check after pulling):
#   pre-commit run --all-files
#
# Bypass for emergencies — justify in the commit message:
#   git commit --no-verify

default_install_hook_types: [pre-commit]

repos:
  # File hygiene: trim whitespace, normalize EOL, catch JSON/YAML/TOML
  # syntax errors, refuse accidental binaries. out/ is generated by
  # render.py — leave it alone here; render-check enforces it matches.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^out/
      - id: end-of-file-fixer
        exclude: ^out/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]

  # Ruff lint. Format-check intentionally off until a one-shot format
  # pass lands — turning it on now would touch hundreds of lines.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--exit-non-zero-on-fix]

  # Gitleaks scans the staged diff for committed secrets (PATs, API keys,
  # AWS credentials, etc). Fast — runs on every commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Local hooks — these shell out to the repo's tooling.
  - repo: local
    hooks:
      # Verify out/ matches what templates render to. Mirrors the CI
      # render-check; catches the "edited template, forgot to re-render"
      # mistake at commit time.
      - id: render-check
        name: Render check (out/ matches templates)
        entry: bash -c 'uv run render.py && git diff --quiet out/ || (echo "out/ is stale — re-rendered files are different from committed. Stage out/ changes."; git --no-pager diff --stat out/; exit 1)'
        language: system
        pass_filenames: false
        files: ^(templates/.*|static/.*|render\.py)$
        require_serial: true
